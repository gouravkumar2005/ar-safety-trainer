<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Implementation Process</title>
<!-- Source for workflow-infographic.png. Re-render with headless Chrome:
     chrome --headless=new --hide-scrollbars --force-device-scale-factor=3
            --window-size=1200,1810 --virtual-time-budget=10000
            --screenshot=workflow-infographic.png workflow-infographic.html -->
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Roboto+Slab:wght@600;700;800&display=block" rel="stylesheet">
<style>
  :root { --ink:#1b1d20; --body:#3b4149; --red:#c4262e; --navy:#2f3e52; }
  html, body { margin:0; background:#fff; }
  #stage { position:relative; width:1200px; height:1810px; background:#fff; overflow:hidden;
           font-family:'Merriweather', Georgia, serif; }
  .card { position:absolute; inset:22px; border:3px solid #2a2d31; border-radius:24px; }
  svg#art { position:absolute; left:0; top:0; }

  .logo { position:absolute; top:46px; right:62px; display:flex; align-items:center; gap:14px; }
  .logo .t { font:800 19px/1.12 'Roboto Slab', Georgia, serif; color:var(--navy); letter-spacing:.05em; }
  .logo .ps { margin-top:6px; font:700 13px/1 'Roboto Slab', Georgia, serif; color:var(--red); letter-spacing:.14em; }

  .title { position:absolute; top:160px; left:0; right:0; display:flex; justify-content:center;
           align-items:center; gap:18px; }
  .title h1 { margin:0; font:800 62px/1 'Roboto Slab', Georgia, serif; color:var(--red); letter-spacing:-.005em; }

  .step { position:absolute; width:440px; transform:translateY(-50%); }
  .step.r { left:665px; text-align:left; }
  .step.l { left:98px;  text-align:right; }
  .step h3 { margin:0 0 12px; font:900 34px/1.2 'Merriweather', Georgia, serif; color:var(--ink); }
  .step p  { margin:0; font:400 21px/1.55 'Merriweather', Georgia, serif; color:var(--body); text-wrap:pretty; }
</style>
</head>
<body>
<div id="stage">
  <div class="card"></div>
  <svg id="art" width="1200" height="1810" viewBox="0 0 1200 1810"></svg>

  <div class="logo">
    <svg width="58" height="76" viewBox="0 0 64 84" aria-hidden="true">
      <defs>
        <clipPath id="lh"><rect x="0" y="0" width="32" height="84"/></clipPath>
        <clipPath id="rh"><rect x="32" y="0" width="32" height="84"/></clipPath>
        <path id="bulb" d="M32 10 C18 10 10 20 10 32 C10 41 15 47 20 52 C23 55 24 58 24 62 H40 C40 58 41 55 44 52 C49 47 54 41 54 32 C54 20 46 10 32 10Z"/>
      </defs>
      <g stroke="#f0b43c" stroke-width="3" stroke-linecap="round">
        <line x1="32" y1="1" x2="32" y2="6"/><line x1="8" y1="9" x2="12" y2="13"/><line x1="56" y1="9" x2="52" y2="13"/>
        <line x1="1" y1="30" x2="6" y2="30"/><line x1="63" y1="30" x2="58" y2="30"/>
      </g>
      <use href="#bulb" fill="#1f9a95" clip-path="url(#lh)"/>
      <use href="#bulb" fill="#f39634" clip-path="url(#rh)"/>
      <g fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M30 20 H22 V27 M30 32 H18 M30 44 H24 V50"/>
        <path d="M34 19 C42 17 47 23 44 28 C49 31 47 38 42 38 C44 43 39 47 34 45"/>
      </g>
      <line x1="32" y1="10" x2="32" y2="62" stroke="#fff" stroke-width="2"/>
      <rect x="23" y="64" width="18" height="5" rx="2" fill="#6b7a8c"/>
      <rect x="24" y="71" width="16" height="5" rx="2" fill="#6b7a8c"/>
      <path d="M27 78 H37 L35 82 H29Z" fill="#2f3e52"/>
    </svg>
    <div>
      <div class="t">SMART INDIA<br>HACKATHON</div>
      <div class="ps">PS · SIH26041</div>
    </div>
  </div>

  <div class="title">
    <svg width="64" height="64" viewBox="-32 -32 64 64" aria-hidden="true" id="gear"></svg>
    <h1>Implementation Process</h1>
  </div>

  <div id="steps"></div>
</div>

<script>
// ---- Content -------------------------------------------------------------
const STEPS = [
  { title:'Worker Registration',
    text:'Worker opens the app on the phone and registers with work ID.',
    icon:'phone' },
  { title:'AR Training',
    text:'3D safety gear and machines appear in real space, with Hindi / English / Santali voice guidance.',
    icon:'ar' },
  { title:'Safety Test',
    text:'Quiz and hands-on simulation check what the worker has learned.',
    icon:'test' },
  { title:'Blockchain Certificate',
    text:'Pass the test to get a tamper-proof certificate with QR verification.',
    icon:'chain', light:true },
  { title:'Admin Dashboard',
    text:'Admin tracks every worker’s progress, compliance and reports live.',
    icon:'dash' },
];

// ---- Geometry ------------------------------------------------------------
const XL = 480, XR = 720;      // centres of the left / right column of circles
const R  = 110;                // road centre-line radius around each circle
const BW = 44;                 // road width
const EDGE = 4;                // dark road edge on each side
const Y0 = 418, DY = 286;      // first circle centre, vertical spacing
const DARK = '#152232';

const cx = i => (i % 2 ? XR : XL);
const cy = i => Y0 + i * DY;
const n  = STEPS.length;

// ---- Icons (drawn in a 0..100 box) ---------------------------------------
const ICONS = {
  // person holding a phone
  phone: `
    <circle cx="38" cy="17" r="10" fill="#fff"/>
    <path d="M24 41 Q24 31 34 31 H43 Q52 31 52 41 V63 H24 Z" fill="#fff"/>
    <rect x="25.5" y="60" width="11" height="31" rx="4.5" fill="#fff"/>
    <rect x="39.5" y="60" width="11" height="31" rx="4.5" fill="#fff"/>
    <path d="M28 38 L22 60" stroke="#fff" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    <path d="M48 37 L58 56 L66 47" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <g transform="rotate(12 72 38)">
      <rect x="61" y="18" width="23" height="39" rx="4.5" fill="#fff"/>
      <rect x="64.5" y="23" width="16" height="27" rx="1.5" fill="${DARK}"/>
      <path d="M72.5 29 L78 32 L72.5 35 L67 32 Z" fill="#3fd0c6"/>
      <path d="M67 32 L72.5 35 V41.5 L67 38.5 Z" fill="#1f9a95"/>
      <path d="M78 32 L72.5 35 V41.5 L78 38.5 Z" fill="#157a76"/>
    </g>`,

  // AR: 3D model in a camera scan frame
  ar: `
    <g fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 30 V18 Q14 14 18 14 H30"/><path d="M70 14 H82 Q86 14 86 18 V30"/>
      <path d="M86 70 V82 Q86 86 82 86 H70"/><path d="M30 86 H18 Q14 86 14 82 V70"/>
    </g>
    <path d="M50 26 L72 38.5 L50 51 L28 38.5 Z" fill="#fff"/>
    <path d="M28 38.5 L50 51 V76 L28 63.5 Z" fill="#cfe8ec"/>
    <path d="M72 38.5 L50 51 V76 L72 63.5 Z" fill="#26b3ab"/>
    <g fill="#f0b43c"><circle cx="24" cy="24" r="3"/><circle cx="78" cy="78" r="3"/></g>`,

  // test: clipboard with a checklist
  test: `
    <rect x="21" y="15" width="58" height="74" rx="7" fill="#fff"/>
    <rect x="36" y="8" width="28" height="15" rx="5" fill="#f0b43c"/>
    <rect x="44" y="11" width="12" height="4" rx="2" fill="${DARK}"/>
    <g fill="none" stroke="#1f9d55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 37 l5 5 l9 -10"/><path d="M30 55 l5 5 l9 -10"/>
    </g>
    <g fill="none" stroke="#d64a2e" stroke-width="5" stroke-linecap="round">
      <path d="M31 69 l10 10 M41 69 l-10 10"/>
    </g>
    <g fill="#9aa7b4"><rect x="50" y="35" width="21" height="5" rx="2.5"/><rect x="50" y="53" width="21" height="5" rx="2.5"/><rect x="50" y="71" width="16" height="5" rx="2.5"/></g>`,

  // blockchain certificate: chained blocks above a sealed certificate
  chain: `
    ${[24,50,76].map(x => `
      <path d="M${x} 9 L${x+10} 14.5 L${x} 20 L${x-10} 14.5 Z" fill="#4a6d9c"/>
      <path d="M${x-10} 14.5 L${x} 20 V31 L${x-10} 25.5 Z" fill="#1f3a5f"/>
      <path d="M${x+10} 14.5 L${x} 20 V31 L${x+10} 25.5 Z" fill="#162c49"/>`).join('')}
    <g stroke="#f08a3c" stroke-width="3.5" stroke-linecap="round"><path d="M35 21 H39 M61 21 H65"/></g>
    <rect x="15" y="40" width="70" height="48" rx="5" fill="#fff" stroke="#1f3a5f" stroke-width="4"/>
    <rect x="24" y="50" width="34" height="5" rx="2" fill="#1f3a5f"/>
    <rect x="24" y="60" width="27" height="4" rx="2" fill="#9aa7b4"/>
    <rect x="24" y="69" width="22" height="4" rx="2" fill="#9aa7b4"/>
    <path d="M64 78 L60 95 L66 91.5 L69.5 97 L72 81 Z" fill="#c53a24"/>
    <path d="M76 78 L80 95 L74 91.5 L70.5 97 L68 81 Z" fill="#c53a24"/>
    <circle cx="70" cy="72" r="12" fill="#f08a3c"/>
    <path d="M64.5 72 l3.8 3.8 l7.2 -7.6" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>`,

  // admin dashboard: monitor with charts and a progress bar
  dash: `
    <rect x="10" y="14" width="80" height="56" rx="6" fill="#fff"/>
    <path d="M43 70 L41 81 H59 L57 70 Z" fill="#fff"/>
    <rect x="31" y="80" width="38" height="6" rx="3" fill="#fff"/>
    <rect x="19" y="46" width="8" height="15" rx="1.5" fill="#1f9a95"/>
    <rect x="31" y="37" width="8" height="24" rx="1.5" fill="#f0b43c"/>
    <rect x="43" y="27" width="8" height="34" rx="1.5" fill="#f08a3c"/>
    <path d="M17 42 L29 33 L37 36 L51 21" fill="none" stroke="${DARK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M45 21 H51 V27" fill="none" stroke="${DARK}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="71" cy="36" r="12" fill="#d64a2e"/>
    <path d="M71 36 L71 24 A12 12 0 0 1 82.4 39.7 Z" fill="#1f9a95"/>
    <rect x="59" y="55" width="24" height="5" rx="2.5" fill="#d5dde5"/>
    <rect x="59" y="55" width="17" height="5" rx="2.5" fill="#1f9d55"/>`,
};

// ---- Road ------------------------------------------------------------------
// One continuous serpentine: it wraps the OUTER half of each circle (left side
// for left circles, right side for right circles) and S-bends between them.
let road = `M${cx(0)} ${cy(0) - R}`;
for (let i = 0; i < n; i++) {
  road += ` A${R} ${R} 0 0 ${i % 2 ? 1 : 0} ${cx(i)} ${cy(i) + R}`;
  if (i < n - 1) {
    const x0 = cx(i), y0 = cy(i) + R, x1 = cx(i + 1), y1 = cy(i + 1) - R, mx = (x0 + x1) / 2;
    road += ` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`;
  }
}
// Lead-in (arrives at circle 1's top heading left) and lead-out (leaves the last circle's bottom).
const inX = cx(0), inY = cy(0) - R;
const tailIn = `M${inX + 170} ${inY - 42} C${inX + 75} ${inY - 42} ${inX + 75} ${inY} ${inX} ${inY}`;
const lastX = cx(n - 1), outY = cy(n - 1) + R, dir = (n - 1) % 2 ? -1 : 1;
const tailOut = `M${lastX} ${outY} C${lastX + dir * 75} ${outY} ${lastX + dir * 75} ${outY + 42} ${lastX + dir * 170} ${outY + 42}`;

const rings = Array.from({ length: n }, (_, i) => `<circle cx="${cx(i)}" cy="${cy(i)}" r="${R}"/>`).join('');
const DASH = 'stroke="#fff" stroke-opacity="0.95" stroke-width="4.5" stroke-dasharray="17 13" fill="none"';

// a road segment = dark edge + coloured surface + dashed lane line
const tail = (d, maskId) => `
  <g mask="url(#${maskId})" fill="none">
    <path d="${d}" stroke="url(#bandDark)" stroke-width="${BW + 2 * EDGE}"/>
    <path d="${d}" stroke="url(#band)" stroke-width="${BW}"/>
    <path d="${d}" ${DASH}/>
  </g>`;

// fade masks for the two tails
const fadeMask = (id, x0, x1, y0, y1) => `
  <linearGradient id="${id}-g" gradientUnits="userSpaceOnUse" x1="${x0}" y1="0" x2="${x1}" y2="0">
    <stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/>
  </linearGradient>
  <mask id="${id}" maskUnits="userSpaceOnUse" x="0" y="0" width="1200" height="1810">
    <rect x="${Math.min(x0, x1) - 40}" y="${y0}" width="${Math.abs(x1 - x0) + 80}" height="${y1 - y0}" fill="url(#${id}-g)"/>
  </mask>`;

const STOPS = [['0', '#0d5c68', '#084650'], ['0.25', '#17a3a0', '#0f7d7b'], ['0.5', '#efb83f', '#c8921f'],
               ['0.75', '#f38a3a', '#cc671e'], ['1', '#dc4a2c', '#ad331b']];
const grad = (id, k) => `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${cy(0)}" x2="0" y2="${cy(n - 1)}">
  ${STOPS.map(s => `<stop offset="${s[0]}" stop-color="${s[k]}"/>`).join('')}</linearGradient>`;

document.getElementById('gear').innerHTML = `<g fill="#c4262e"><circle r="22"/>${[...Array(8)].map((_, k) =>
  `<rect x="-6.5" y="-31" width="13" height="13" rx="2.5" transform="rotate(${k * 45})"/>`).join('')}</g>
  <circle r="13" fill="#fff"/><circle r="7" fill="#c4262e"/>`;

document.getElementById('art').innerHTML = `
  <defs>
    ${grad('band', 1)}
    ${grad('bandDark', 2)}
    ${fadeMask('fadeIn',  inX + 170, inX + 20, inY - 80, inY + 40)}
    ${fadeMask('fadeOut', lastX + dir * 170, lastX + dir * 20, outY - 40, outY + 80)}
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1a2a" flood-opacity="0.18"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0b1a2a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    ${tail(tailIn, 'fadeIn')}
    ${tail(tailOut, 'fadeOut')}
    <g fill="none" stroke="url(#bandDark)" stroke-width="${BW + 2 * EDGE}">
      <path d="${road}"/>${rings}
    </g>
    <g fill="none" stroke="url(#band)" stroke-width="${BW}">
      <path d="${road}"/>${rings}
    </g>
  </g>
  <path d="${road}" ${DASH}/>

  ${STEPS.map((s, i) => `
    <circle cx="${cx(i)}" cy="${cy(i)}" r="${R - BW / 2 - EDGE}" fill="#fff"/>
    <circle cx="${cx(i)}" cy="${cy(i)}" r="${R - BW / 2 - EDGE - 12}" fill="${s.light ? '#eef3f7' : DARK}"
            ${s.light ? 'stroke="#c9d5e0" stroke-width="3"' : ''} filter="url(#soft)"/>
    <g transform="translate(${cx(i) - 51} ${cy(i) - 51}) scale(1.02)">${ICONS[s.icon]}</g>`).join('')}
`;

document.getElementById('steps').innerHTML = STEPS.map((s, i) => `
  <div class="step ${i % 2 ? 'l' : 'r'}" style="top:${cy(i)}px">
    <h3>${s.title}</h3>
    <p>${s.text}</p>
  </div>`).join('');
</script>
</body>
</html>
